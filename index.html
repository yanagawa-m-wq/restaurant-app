<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>飲食店 相互マッチングファインダー</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* スマホでのタッチ操作最適化（長押しによる選択ハイライト防止など） */
        body {
            -webkit-tap-highlight-color: transparent;
        }
        /* スムーズスクロール */
        html {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen pb-12">

    <!-- ヘッダー -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-20 shadow-xs">
        <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <span class="text-2xl">🍽️</span>
                <h1 class="text-base font-bold text-slate-900 leading-tight">グルメ・マッチング<br class="hidden sm:inline">ファインダー</h1>
            </div>
            <button id="reset-btn" class="text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-600 px-3 py-2 rounded-xl transition active:scale-95">
                条件クリア
            </button>
        </div>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-4 space-y-4">
        
        <!-- メンバー選択エリア（横スクロールチップ / タップしやすいデザイン） -->
        <section class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200">
            <div class="flex items-center justify-between mb-2">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">👥 同行メンバーで絞り込む</h2>
                <span id="active-count" class="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded-full hidden">0人選択中</span>
            </div>
            <p class="text-xs text-slate-500 mb-3">全員が行けるお店を自動で絞り込みます（複数選択可）</p>
            
            <!-- チップ形式のメンバー選択ボタン（スマホの押しやすさを考慮） -->
            <div id="member-filters" class="flex flex-wrap gap-2">
                <!-- 動的生成 -->
            </div>
        </section>

        <!-- 店舗一覧エリア -->
        <section class="space-y-3">
            <div class="flex items-center justify-between px-1">
                <h2 class="text-sm font-bold text-slate-700">🏪 該当する店舗一覧</h2>
                <span id="result-count" class="text-xs font-bold bg-slate-200 text-slate-700 px-2.5 py-1 rounded-full">0件</span>
            </div>

            <!-- 店舗リストカード -->
            <div id="store-list" class="space-y-3">
                <!-- 動的生成 -->
            </div>
        </section>

    </main>

    <!-- JavaScript -->
    <script>
        // --- モックデータ ---
        const members = [
            { id: 'm1', name: '田中 (肉好き)' },
            { id: 'm2', name: '佐藤 (魚・和食)' },
            { id: 'm3', name: '鈴木 (お酒好き)' },
            { id: 'm4', name: '高橋 (イタリアン)' }
        ];

        const stores = [
            {
                id: 's1',
                name: '炭火焼肉 牛角隠れ家',
                genre: '焼肉',
                budget: '¥5,000〜¥7,000',
                memo: 'みんなでワイワイできる個室あり。お肉の質が最高。',
                memberIds: ['m1', 'm3']
            },
            {
                id: 's2',
                name: '海鮮居酒屋 磯の香',
                genre: '和食・海鮮',
                budget: '¥4,000〜¥5,000',
                memo: '毎朝市場から仕入れる鮮魚と日本酒が自慢。',
                memberIds: ['m2', 'm3']
            },
            {
                id: 's3',
                name: 'トラットリア・レモン',
                genre: 'イタリアン',
                budget: '¥3,000〜¥4,000',
                memo: '石窯ピザと手打ちパスタが人気。',
                memberIds: ['m1', 'm4']
            },
            {
                id: 's4',
                name: '大衆酒場 ぴょん吉',
                genre: '居酒屋',
                budget: '¥2,000〜¥3,000',
                memo: 'コスパ最強。サク飲みから宴会まで対応。',
                memberIds: ['m1', 'm2', 'm3']
            },
            {
                id: 's5',
                name: '隠れ家ビストロ Petit',
                genre: 'フレンチ',
                budget: '¥6,000〜¥8,000',
                memo: '落ち着いた雰囲気。ワインと肉料理が美味しい。',
                memberIds: ['m2', 'm4']
            },
            {
                id: 's6',
                name: '全メンバー大集合居酒屋 絆',
                genre: '居酒屋',
                budget: '¥3,500〜¥4,500',
                memo: '大人数宴会に最適！広々としたお座敷完備。',
                memberIds: ['m1', 'm2', 'm3', 'm4']
            }
        ];

        // --- アプリケーションの状態 ---
        let selectedMemberIds = [];

        // --- DOM要素 ---
        const memberFiltersEl = document.getElementById('member-filters');
        const storeListEl = document.getElementById('store-list');
        const resultCountEl = document.getElementById('result-count');
        const activeCountEl = document.getElementById('active-count');
        const resetBtn = document.getElementById('reset-btn');

        // --- 初期化 ---
        function init() {
            renderMemberFilters();
            renderStores();

            resetBtn.addEventListener('click', () => {
                selectedMemberIds = [];
                updateMemberUI();
                renderStores();
            });
        }

        // --- メンバーフィルターの描画（スマホ向けチップボタン） ---
        function renderMemberFilters() {
            memberFiltersEl.innerHTML = members.map(m => `
                <button type="button" 
                    data-id="${m.id}" 
                    class="member-chip flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white border-slate-200 text-slate-600 shadow-2xs">
                    <span class="w-2 h-2 rounded-full bg-slate-300 indicator"></span>
                    <span>${m.name}</span>
                </button>
            `).join('');

            // タップイベントの設定
            document.querySelectorAll('.member-chip').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    if (selectedMemberIds.includes(id)) {
                        selectedMemberIds = selectedMemberIds.filter(item => item !== id);
                    } else {
                        selectedMemberIds.push(id);
                    }
                    updateMemberUI();
                    renderStores();
                });
            });
        }

        // --- メンバーボタンの見た目更新 ---
        function updateMemberUI() {
            document.querySelectorAll('.member-chip').forEach(btn => {
                const id = btn.dataset.id;
                const indicator = btn.querySelector('.indicator');
                if (selectedMemberIds.includes(id)) {
                    // 選択中のスタイル
                    btn.className = "member-chip flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-indigo-600 border-indigo-600 text-white shadow-sm shadow-indigo-100";
                    indicator.className = "w-2 h-2 rounded-full bg-white indicator";
                } else {
                    // 未選択のスタイル
                    btn.className = "member-chip flex items-center space-x-1.5 px-3.5 py-2 rounded-xl text-xs font-bold border transition-all active:scale-95 bg-white border-slate-200 text-slate-600 shadow-2xs";
                    indicator.className = "w-2 h-2 rounded-full bg-slate-300 indicator";
                }
            });

            // 選択中カウンターの表示切り替え
            if (selectedMemberIds.length > 0) {
                activeCountEl.textContent = `${selectedMemberIds.length}人選択中`;
                activeCountEl.classList.remove('hidden');
            } else {
                activeCountEl.classList.add('hidden');
            }
        }

        // --- 店舗一覧の描画 ---
        function renderStores() {
            const filteredStores = stores.filter(store => {
                return selectedMemberIds.every(selectedId => store.memberIds.includes(selectedId));
            });

            resultCountEl.textContent = `${filteredStores.length}件`;

            if (filteredStores.length === 0) {
                storeListEl.innerHTML = `
                    <div class="bg-white rounded-2xl p-8 text-center border border-slate-200">
                        <p class="text-base font-bold text-slate-700 mb-1">条件に一致するお店がありません</p>
                        <p class="text-xs text-slate-400">選択するメンバーを減らすと見つかる場合があります。</p>
                    </div>
                `;
                return;
            }

            storeListEl.innerHTML = filteredStores.map(store => {
                const memberBadges = store.memberIds.map(mId => {
                    const member = members.find(m => m.id === mId);
                    const isSelected = selectedMemberIds.includes(mId);
                    const badgeStyle = isSelected 
                        ? 'bg-indigo-50 text-indigo-700 border border-indigo-200 font-bold' 
                        : 'bg-slate-100 text-slate-500 border border-transparent';
                    return `<span class="text-[11px] px-2 py-0.5 rounded-md ${badgeStyle}">${member ? member.name.split(' ')[0] : ''}</span>`;
                }).join(' ');

                return `
                    <div class="bg-white rounded-2xl p-4 border border-slate-200 shadow-2xs space-y-3">
                        <div class="flex items-start justify-between gap-2">
                            <div>
                                <h3 class="font-bold text-base text-slate-900 leading-snug">${store.name}</h3>
                                <div class="flex items-center space-x-2 mt-1">
                                    <span class="text-[11px] font-bold bg-amber-50 text-amber-700 border border-amber-200 px-2 py-0.5 rounded">${store.genre}</span>
                                    <span class="text-xs font-semibold text-slate-500">${store.budget}</span>
                                </div>
                            </div>
                        </div>
                        
                        <p class="text-xs text-slate-600 leading-relaxed">${store.memo}</p>
                        
                        <div class="pt-2 border-t border-slate-100 flex items-center justify-between flex-wrap gap-1">
                            <span class="text-[11px] text-slate-400">メンバー:</span>
                            <div class="flex flex-wrap gap-1">${memberBadges}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // 起動
        init();
    </script>
</body>
</html>
